<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>项目记录器 · 手机版预览</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 0%, #24313a, #10151a 70%);
      color: #dce5e8;
      font: 14px/1.4 "Microsoft YaHei UI", "PingFang SC", sans-serif;
    }
    .wrap { display: grid; gap: 14px; justify-items: center; padding: 20px; }
    .caption { font-size: 13px; color: #aebdc3; letter-spacing: .04em; }
    .phone {
      width: min(390px, 96vw);
      height: min(844px, calc(100vh - 100px));
      padding: 8px;
      border-radius: 34px;
      background: #0b0d0f;
      box-shadow: 0 28px 80px rgba(0,0,0,.55), 0 0 0 1px #3a454b;
      position: relative;
    }
    .phone::before {
      content: "";
      position: absolute;
      z-index: 2;
      top: 13px;
      left: 50%;
      width: 110px;
      height: 22px;
      transform: translateX(-50%);
      border-radius: 0 0 14px 14px;
      background: #0b0d0f;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 27px;
      background: #f4f5f7;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="caption">项目记录器 · 手机版界面预览</div>
    <div class="phone"><iframe src="./" title="项目记录器手机版"></iframe></div>
  </div>
</body>
</html>
